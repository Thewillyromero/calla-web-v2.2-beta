- generic [ref=e2]: "> ## Documentation Index > Fetch the complete documentation index at: https://docs.lovable.dev/llms.txt > Use this file to discover all available pages before exploring further. # Lovable API > Learn what the Lovable API is, what it enables, and how to get started building apps programmatically with Lovable. The **Lovable API** makes it possible to create and share Lovable apps programmatically — turning ideas, prompts, or even images into fully-generated applications with a single link. It’s designed for developers, creators, and teams who want to **integrate Lovable into their workflows** or **automate app generation** from anywhere on the web. ## What is the Lovable API? The Lovable API is a growing suite of features that extend what you can do with Lovable beyond the web interface. The first release, [**Build with URL**](https://docs.lovable.dev/integrations/build-with-url), allows you to generate apps directly from a shareable URL. With it, you can: * Embed **Build with Lovable** buttons on your site or app. * Share app-generating links with teammates or customers. * Integrate Lovable app creation into internal tools or scripts. * Prototype instantly from a single link. ## Why use the Lovable API? * **Automation:** Trigger app creation from code, dashboards, or workflows. * **Integration:** Bring Lovable into your own product experience. * **Speed:** Generate and share new app ideas faster than ever. * **Shareability:** URLs make collaboration simple and frictionless. ## Get started * Read the full technical guide here: [**Lovable API: Build with URL documentation**](https://docs.lovable.dev/integrations/build-with-url) * Learn about the feature and real-world use cases in our announcement post:\\ [**Build apps from a link with Lovable Build with URL**](https://lovable.dev/blog/introducing-lovable-api-build-with-url) ## What’s next for the Lovable API? The Lovable API is expanding. The latest addition is the [**MCP Server (Research Preview)**](/integrations/lovable-mcp-server) — a Model Context Protocol server at `https://mcp.lovable.dev` that lets AI clients like Claude Desktop and Cursor manage Lovable projects through natural language. More endpoints and integration options are on the way. Follow updates on the [Lovable Blog](https://lovable.dev/blog)."