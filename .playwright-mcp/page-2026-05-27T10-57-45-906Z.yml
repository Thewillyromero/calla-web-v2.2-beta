              - generic [ref=e477]: A workspace connection authorizes Lovable to access a GitHub account or organization through the Lovable GitHub app. This grants Lovable permission to create and update repositories in your chosen account or organization.
              - generic [ref=e478]: Workspace connections are shared across the workspace and can be reused by multiple projects.
              - generic [ref=e479]: "A workspace can contain:"
