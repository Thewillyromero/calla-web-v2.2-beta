- generic [ref=e2]: "# Lovable Documentation > Lovable Documentation — Build full-stack websites with AI using natural language. Explore Lovable features, integrations, tutorials, and best practices. ## Docs - [AGENTS](https://docs.lovable.dev/AGENTS.md) - [Lovable changelog](https://docs.lovable.dev/changelog.md): Lovable changelog and product updates. Stay up to date with new features, improvements, and bug fixes shipped in Lovable. - [Build in Agent mode](https://docs.lovable.dev/features/agent-mode.md): Agent mode lets Lovable implement and verify changes directly in your project, handling execution end to end with minimal supervision. - [Project analytics](https://docs.lovable.dev/features/analytics.md): Track visitors, pageviews, bounce rate, visit duration, traffic sources, and device usage for your published apps in real time. - [Audit logs](https://docs.lovable.dev/features/audit-logs.md): Monitor workspace activity with Enterprise audit logs. Filter by action, member, or time range to review events such as membership changes, project actions, authentication events, and workspace settings or configuration changes. - [Publish apps with branded URLs](https://docs.lovable.dev/features/branded-workspace-urls.md): Create consistent, branded URLs for every app in your workspace. - [Test your app in a browser](https://docs.lovable.dev/features/browser-testing.md): Learn how Lovable uses browser testing to verify your app by clicking buttons, filling forms, testing flows, and checking behavior across screen sizes. - [Manage training data and privacy](https://docs.lovable.dev/features/business/data-opt-out.md): Control whether your workspace data is used for AI model training and understand how Lovable handles personally identifiable information. - [Design templates](https://docs.lovable.dev/features/business/design-templates.md): Reuse Lovable projects as design templates. Templates copy the full codebase, including design, components, and structure, to maintain consistency and accelerate development. - [Set up SCIM user provisioning](https://docs.lovable.dev/features/business/scim.md): Configure SCIM provisioning to automatically create, update, and remove users in Lovable using your identity provider. Manage user access, roles, and lifecycle centrally with Okta, Microsoft Entra ID, and other SCIM 2.0 providers. - [Set up workspace single sign-on (SSO)](https://docs.lovable.dev/features/business/sso.md): Connect Okta, Auth0, Microsoft Entra ID, or any OIDC/SAML 2.0 provider to enable secure, centralized authentication for your workspace. - [Add SAML single sign-on to Lovable Cloud apps](https://docs.lovable.dev/features/cloud-saml-sso.md): Let end users of your Lovable Cloud app sign in with their company identity provider (Okta, Microsoft Entra ID, Google Workspace, OneLogin, JumpCloud, or any SAML 2.0 IdP). - [View and edit project code](https://docs.lovable.dev/features/code-mode.md): View and manually edit your project’s source code directly in the Lovable code editor. - [Collaboration](https://docs.lovable.dev/features/collaboration.md): Invite teammates to projects or workspaces, assign roles and permissions, and see changes in real time as you build together. - [Cross-project referencing](https://docs.lovable.dev/features/cross-project-referencing.md): Reuse implementations across projects in your workspace, including code, assets, files, and chat history. Maintain consistency and avoid rebuilding the same features. - [Set up a custom domain](https://docs.lovable.dev/features/custom-domain.md): Learn how to buy, connect, verify, troubleshoot, and manage custom domains in Lovable. - [Send branded emails from your own domain](https://docs.lovable.dev/features/custom-emails.md): Send branded emails, including authentication emails and custom app emails, from your own email domain with automatic DNS, SPF, DKIM, and DMARC setup to improve deliverability, protect your domain reputation, and strengthen brand trust. - [Visual edits](https://docs.lovable.dev/features/design.md): Use visual edits to modify UI elements, adjust layouts, and update styling without writing code. - [Design guidance](https://docs.lovable.dev/features/design-guidance.md): Pick from three design previews before Lovable builds, and steer typography, color, and layout when you want a specific look. - [Design systems](https://docs.lovable.dev/features/design-systems.md): Create reusable design systems in Lovable to standardize React component libraries, styling guidelines, and setup across enterprise projects. - [Build safely with Test and Live environments (Beta)](https://docs.lovable.dev/features/environments.md): Safely separate test and production environments in Lovable Cloud. Build in Test, publish intentionally to Live, and prevent accidental changes to production data. - [Generate files and analyze data](https://docs.lovable.dev/features/generate-files.md): Analyze data, generate files, and build from the results directly in the chat. - [Add Google authentication to Lovable Cloud apps](https://docs.lovable.dev/features/google-auth.md): Add Google authentication to Lovable Cloud apps using managed Google OAuth or your own Google Cloud credentials. - [Groups](https://docs.lovable.dev/features/groups.md): Organize workspace members into groups for granular control over project access and published app visibility. - [Define workspace and project knowledge](https://docs.lovable.dev/features/knowledge.md): Define persistent instructions for Lovable using workspace knowledge and project knowledge. Set shared coding standards, architecture rules, and project context that Lovable remembers across conversations and projects. - [Add payments to your app](https://docs.lovable.dev/features/payments.md): Accept subscriptions and one-time payments in any Lovable app using built-in Paddle or Stripe integration. - [Manage workspace members from the People tab](https://docs.lovable.dev/features/people.md): Manage workspace members, invitations, roles, access requests, and per-member credit limits. - [Brainstorm in Plan mode](https://docs.lovable.dev/features/plan-mode.md): Plan mode helps you think, explore, and decide before any code is written. Use it to ask questions, debug issues, compare approaches, or create a structured plan when you are ready to build. - [Project comments](https://docs.lovable.dev/features/project-comments.md): Leave comments directly on elements in your project. - [Control project access](https://docs.lovable.dev/features/project-visibility.md): Control who can view, remix, or collaborate on your projects. Choose whether projects are accessible to all workspace members, or restricted to invited users only. - [Publish your Lovable project](https://docs.lovable.dev/features/publish.md): Deploy your project to a live URL, control who can access the published app, configure site metadata, and update or unpublish at any time. - [Security overview](https://docs.lovable.dev/features/security.md): Protect your apps with API key detection, database access controls, and AI-powered security scanning during development and before publishing. - [Workspace security center](https://docs.lovable.dev/features/security-center.md): A centralized workspace security dashboard for monitoring security findings, scan coverage, secrets, and dependency risks across all projects. - [Project security view](https://docs.lovable.dev/features/security-view.md): Review security findings, fix vulnerabilities, and manage dependency risks for a single project before publishing. - [Optimize your app for SEO and AI search](https://docs.lovable.dev/features/seo-aeo.md): Run an SEO and AI search review, research keywords and competitors with live Semrush data, and connect a custom domain to help your Lovable app rank on Google, Bing, and AI search engines. - [Share a project with internal or external collaborators](https://docs.lovable.dev/features/share-project.md): Manage project access and invite people to collaborate on a project. - [Define reusable instructions with skills](https://docs.lovable.dev/features/skills.md): Define reusable, on-demand workflows for Lovable using workspace skills. Package focused instructions, playbooks, and checklists that Lovable applies whenever a matching task comes up across every project in your workspace. - [Test and verify your app](https://docs.lovable.dev/features/testing.md): Lovable provides browser testing, frontend tests, and edge function verification to help understand system behavior, validate user workflows, and ensure backend logic works as expected. - [Lovable workspace](https://docs.lovable.dev/features/workspace.md): Manage your team's projects, members, billing, and settings in one central place. - [Workspace admin settings](https://docs.lovable.dev/features/workspace-admin-settings.md): Overview of settings available to workspace owners and admins, including workspace details, access and organization, templates, billing and usage, workspace domains, security and compliance, and development settings. - [Glossary](https://docs.lovable.dev/glossary.md): Definitions of Lovable features, UI/UX terms, frontend and backend concepts, Supabase terminology, and design patterns. - [AI features for your app](https://docs.lovable.dev/integrations/ai.md): Add AI capabilities directly to the apps you build with Lovable. No API keys or provider setup required. Enable chatbots, summaries, document Q&A, translation, automation, image generation, semantic search, and more. - [Run AI-powered penetration tests with Aikido](https://docs.lovable.dev/integrations/aikido.md): Run AI-powered penetration tests on your Lovable projects with Aikido to identify real exploitable vulnerabilities and generate shareable security reports. - [Connect your app to Airtable](https://docs.lovable.dev/integrations/airtable.md): Connect your app to Airtable, a spreadsheet-database hybrid, to read and write bases, tables, and records, and turn an Airtable base into a custom app interface. - [Connect your app to Algolia](https://docs.lovable.dev/integrations/algolia.md): Connect your app to Algolia to add full-text search, faceted filtering, and indexing to your Lovable app. - [Connect your app to Asana](https://docs.lovable.dev/integrations/asana.md): Connect your app to Asana with a personal access token (PAT) to create and update tasks, read project and team data, and automate work tracking workflows in your Lovable apps. - [Connect your app to Ashby](https://docs.lovable.dev/integrations/ashby.md): Connect Ashby to your Lovable app to work with jobs, candidates, applications, and hiring workflows through the Ashby API and Lovable’s connector gateway. - [Connect your app to Attention](https://docs.lovable.dev/integrations/attention.md): Connect your app to Attention, a sales conversation intelligence platform, to read meeting transcripts and scorecards, write back snippets and QA results, and ask natural-language questions across your sales conversations. - [Connect your app to AWS S3](https://docs.lovable.dev/integrations/aws-s3.md): Connect your app to AWS S3 to read and write CSV, JSON, Parquet, and other data files in S3 buckets from your Lovable apps. - [Connect your app to BigQuery](https://docs.lovable.dev/integrations/bigquery.md): Connect Google BigQuery to your Lovable app using Workload Identity Federation. Run SQL, explore datasets and schemas, and build analytics features without storing long-lived GCP keys in your project. - [Connect your app to Brevo](https://docs.lovable.dev/integrations/brevo.md): Connect your app to Brevo to send transactional and marketing emails, manage contacts and lists, and trigger communication workflows from your Lovable app. - [Lovable API: Build with URL ](https://docs.lovable.dev/integrations/build-with-url.md): The Lovable API Build with URL feature is now in open Beta, enabling you to build and share Lovable apps using simple, shareable URLs. - [Lovable Cloud](https://docs.lovable.dev/integrations/cloud.md): Lovable Cloud is a full-stack hosting platform with built-in database, authentication, storage, edge functions, and AI, no infrastructure setup required. - [Connect your app to Contentful](https://docs.lovable.dev/integrations/contentful.md): Connect your app to Contentful to fetch and display published content from your headless CMS, including entries, assets, and rich text. - [Connect your app to Databricks](https://docs.lovable.dev/integrations/databricks.md): Connect your app to Databricks to query warehouse data, build live dashboards, and power data-driven tools using your existing tables and views. - [Lovable desktop app](https://docs.lovable.dev/integrations/desktop-app.md): Use Lovable as a native desktop application. Connect local tools, manage multiple projects in tabs, and move faster with keyboard shortcuts. - [Connect ElevenLabs to enable voice AI in your app](https://docs.lovable.dev/integrations/eleven-labs.md): Connect your app to ElevenLabs, an AI audio platform, to generate high-quality speech and audio content. - [Connect Firecrawl to scrape web data for your app](https://docs.lovable.dev/integrations/firecrawl.md): Connect your app to Firecrawl, an AI-powered scraper and crawler, to extract structured data from websites. - [Connect your app to Fireflies](https://docs.lovable.dev/integrations/fireflies.md): Connect your app to Fireflies to access meeting transcripts, summaries, and conversation insights. - [Connect your app to Gemini Enterprise](https://docs.lovable.dev/integrations/gemini-enterprise.md): Connect your app to Gemini Enterprise to search and summarize connected enterprise data, show grounded answers with citations, and build search or chat experiences on top of your existing Gemini Enterprise engine. - [Connect to GitHub](https://docs.lovable.dev/integrations/github.md): Connect your Lovable project to github.com, GitHub Enterprise Cloud (data residency), or self-hosted GitHub Enterprise Server for code backup, collaboration, and deployment. - [Connect your project to GitLab](https://docs.lovable.dev/integrations/gitlab.md): Connect your Lovable project to GitLab.com or a self-managed GitLab instance for code backup, collaboration, and deployment. - [Connect your app to Google Maps Platform](https://docs.lovable.dev/integrations/google-maps.md): Connect Google Maps Platform to your Lovable app to geocode addresses, calculate routes, search places, embed interactive maps, and pull location-aware data like weather, air quality, and solar potential, using a managed connection or your own API keys. - [Connect your app to Google Search Console (GSC)](https://docs.lovable.dev/integrations/google-search-console.md): Connect your app to Google Search Console (GSC), Google's free service for monitoring search performance, to verify domains, submit sitemaps, read search analytics, and answer SEO questions directly in chat, or to build SEO features into your Lovable app. - [Connect your app to Google Workspace](https://docs.lovable.dev/integrations/google-workspace.md): Connect your app to Google Workspace to read and send email, manage calendars, store and create files, and use Google tools like Sheets, Docs, and Slides as part of your app's workflows. - [Connect your app to Granola](https://docs.lovable.dev/integrations/granola.md): Connect your app to Granola, an AI meeting notes platform, to bring meeting notes, AI summaries, and transcripts from your Granola workspace into your Lovable apps. - [Connect your app to HubSpot](https://docs.lovable.dev/integrations/hubspot.md): Connect your app to HubSpot, a CRM platform, to manage contacts, track deals, and automate sales and marketing workflows. - [Connect your app to Inngest](https://docs.lovable.dev/integrations/inngest.md): Connect your app to Inngest to add background jobs, scheduled tasks, and durable workflows to your Lovable apps using your own Inngest account. - [Lovable integrations: Connect tools, MCP servers, and APIs](https://docs.lovable.dev/integrations/introduction.md): Connect Lovable to external tools, MCP servers, and APIs. Add app functionality, use real data as context, and securely integrate third-party services. - [Connect your app to Linear](https://docs.lovable.dev/integrations/linear.md): Connect your app to Linear to create and update issues, read project and team data, and build issue tracking workflows in your Lovable apps. - [Lovable API](https://docs.lovable.dev/integrations/lovable-api.md): Learn what the Lovable API is, what it enables, and how to get started building apps programmatically with Lovable. - [Lovable MCP server (research preview)](https://docs.lovable.dev/integrations/lovable-mcp-server.md): Connect AI agents and developer tools to Lovable using the Model Context Protocol. Build, iterate, and deploy apps programmatically. - [Lovable mobile app](https://docs.lovable.dev/integrations/lovable-mobile-app.md): Build, prompt, and review your Lovable projects from your phone or tablet. - [Connect your app to Mailgun](https://docs.lovable.dev/integrations/mailgun.md): Connect your app to Mailgun to send transactional email, manage sending domains, and track delivery events from your Lovable app. - [Chat connectors: Connect your tools to Lovable using MCP servers](https://docs.lovable.dev/integrations/mcp-servers.md): Connect Lovable to your personal tool accounts using MCP servers as chat connectors. Bring real context from tools like Notion, Linear, Jira, or Miro directly into your builds, moving from idea to validation to live app faster than ever. - [Connect your app to Microsoft 365](https://docs.lovable.dev/integrations/microsoft.md): Connect Microsoft Outlook, Teams, OneDrive, Word, Excel, PowerPoint, and OneNote to your Lovable app. All use the same Microsoft sign-in and Microsoft Graph pattern—one guide for every Microsoft connector. - [Connect your app to Notion](https://docs.lovable.dev/integrations/notion.md): Connect your app to Notion, an all-in-one workspace for docs, wikis, and databases, to read and write pages, query databases, and build apps backed by content your team manages in Notion. - [Connect your app to Perplexity](https://docs.lovable.dev/integrations/perplexity.md): Connect your app to Perplexity, an AI-powered search engine, to retrieve real-time information with verifiable citations. - [Connect your app to Resend](https://docs.lovable.dev/integrations/resend.md): Connect your app to Resend to send transactional and marketing emails from Lovable apps using your own Resend account. - [Connect your app to Semrush](https://docs.lovable.dev/integrations/semrush.md): Connect your app to Semrush, an SEO and competitive analysis platform, to power apps with keyword research, domain analytics, backlink data, and project management. - [Build a Shopify store with AI](https://docs.lovable.dev/integrations/shopify.md): Learn how to create a new Shopify store or connect an existing one to Lovable, then build and launch your storefront. - [Connect your app to Slack](https://docs.lovable.dev/integrations/slack.md): Connect your app to Slack to send messages, read channels, automate alerts, generate digests, and integrate workspace workflows using bot or personal access. - [Connect your app to Snowflake](https://docs.lovable.dev/integrations/snowflake.md): Connect Snowflake to your Lovable app using Snowflake OAuth. Run SQL, use the SQL REST API, and work with warehouses and data from your Snowflake account through Lovable’s connector gateway. - [Connect your app to Storyblok](https://docs.lovable.dev/integrations/storyblok.md): Connect your app to Storyblok, a headless CMS and visual page builder, to power content-driven sites and apps with editor-managed stories, components, and assets. - [Set up app payments with Stripe](https://docs.lovable.dev/integrations/stripe.md): Add one-time payments or subscriptions to your app using chat-driven Stripe integration with Supabase Edge Functions. - [Connect to Supabase](https://docs.lovable.dev/integrations/supabase.md): Connect Lovable with Supabase for seamless backend setup, database, auth, storage, real-time and serverless functions. - [Connect your app to Telegram](https://docs.lovable.dev/integrations/telegram.md): Send and receive Telegram messages in apps you build with Lovable. This is for app integrations, not for chatting with Lovable in Telegram. - [Connect your app to TikTok](https://docs.lovable.dev/integrations/tiktok.md): Connect your app to TikTok to read creator profiles, fetch published videos, and build social integrations from your Lovable app. - [Connect your app to Twilio](https://docs.lovable.dev/integrations/twilio.md): Connect your app to Twilio to send SMS and MMS messages, make voice calls, and add phone-based communication flows directly to your Lovable app. - [Connect your app to Twitch](https://docs.lovable.dev/integrations/twitch.md): Connect your app to Twitch to build custom stream overlays, display live stream data, track channel activity, and create tools for creators and communities directly from your Lovable app. - [Scan your projects for vulnerabilities with Wiz](https://docs.lovable.dev/integrations/wiz.md): Automatically scan your Lovable projects for vulnerabilities and code-security issues using Wiz to catch known CVEs and risky code patterns before you ship. - [Connect your app to WordPress.com](https://docs.lovable.dev/integrations/wordpress-com.md): Use WordPress.com as a headless CMS with Lovable: fetch posts, pages, and media for your app’s UI, and build workflows that publish or update content through a secure OAuth connection. - [Create an account](https://docs.lovable.dev/introduction/create-an-account.md): Create your Lovable account to start building and iterating on full-stack web applications using natural language. - [Dashboard overview](https://docs.lovable.dev/introduction/dashboard-overview.md): Learn how to navigate the Lovable dashboard, start new projects, and access your workspace settings. - [Delete account](https://docs.lovable.dev/introduction/delete-account.md): Permanently delete your Lovable account, with a 30-day grace period to change your mind. - [Delete a workspace](https://docs.lovable.dev/introduction/delete-workspace.md): Permanently delete a workspace you no longer need, with a 60-day grace period during which Lovable support can restore it. - [FAQ](https://docs.lovable.dev/introduction/faq.md): Answers to common questions about building apps, managing projects, account settings, security, and how Lovable works. - [Quick start](https://docs.lovable.dev/introduction/getting-started.md): Create your first project, navigate the dashboard, add backend capabilities, and publish your app step by step - [Account settings](https://docs.lovable.dev/introduction/lovable-account-settings.md): Manage your personal identity, profile, preferences, and account security on Lovable. - [Plans and credits](https://docs.lovable.dev/introduction/plans-and-credits.md): Compare Free, Pro, and Business plans, understand how credits work, and manage your subscription and billing. - [Organize projects in folders](https://docs.lovable.dev/introduction/project-folders.md): Group related projects into folders to keep your workspace organized. - [Find and search projects](https://docs.lovable.dev/introduction/project-search-and-find.md): Use the command palette, filters, and sorting to quickly find any project in your workspace. - [Support policy](https://docs.lovable.dev/introduction/support-policy.md): Get help with billing, platform bugs, and account issues through the support form. Community support is available on Discord. - [Two-factor authentication (2FA)](https://docs.lovable.dev/introduction/two-factor-authentication-2-fa.md): Learn how to set up and manage two-factor authentication (2FA) on your Lovable account, and give your account an extra layer of security. - [Video tutorials](https://docs.lovable.dev/introduction/video-tutorials.md): Watch step-by-step tutorials for building calorie trackers, CRMs, feedback tools, landing pages, and AI-powered apps with Lovable. - [Welcome to Lovable](https://docs.lovable.dev/introduction/welcome.md): Lovable is a full-stack AI development platform for building, iterating on, and deploying web applications using natural language, with real code, security, and enterprise governance. - [Debugging prompts](https://docs.lovable.dev/prompting/prompting-debugging.md): Use Plan mode to investigate errors, run codebase audits, handle fragile updates safely, and resolve persistent issues systematically. - [Prompting best practices](https://docs.lovable.dev/prompting/prompting-one.md): Plan before you prompt, build by component, use real content, and apply design buzzwords to get consistent, high-quality results. - [21st.dev integration](https://docs.lovable.dev/tips-tricks/21stdev.md): Copy pre-built hero sections, navigation bars, testimonials, and other UI components from 21st.dev directly into your projects. - [Best practices](https://docs.lovable.dev/tips-tricks/best-practice.md): Use knowledge files, Plan mode, visual edits, and version control effectively to build faster and avoid common pitfalls. - [Lovable ChatGPT app](https://docs.lovable.dev/tips-tricks/chatgpt-app.md): Turn your ChatGPT brainstorms into full-stack apps by tagging @Lovable directly in your conversations. - [Using custom (Google) fonts](https://docs.lovable.dev/tips-tricks/custom-fonts.md): Apply web-safe fonts like Arial or Courier New, or import Google Fonts by name or URL to customize your project's typography. - [Deployment, hosting, and ownership options with Lovable Cloud](https://docs.lovable.dev/tips-tricks/deployment-hosting-ownership.md): An overview of deployment and hosting options for Lovable Cloud applications, including code ownership, data portability, and paths to self-hosting or external infrastructure. - [Deploying and hosting outside Lovable Cloud](https://docs.lovable.dev/tips-tricks/external-deployment-hosting.md): An overview of common ways to deploy and host Lovable applications outside Lovable Cloud, with examples using managed platforms and self-hosted infrastructure. - [From idea to working app](https://docs.lovable.dev/tips-tricks/from-idea-to-app.md): Plan before you prompt, choose frontend-first or back-to-front builds, use Plan mode for debugging, and validate with real users. - [Vibe coding LinkedIn certification (Beta)](https://docs.lovable.dev/tips-tricks/linkedin-certification.md): Track your Lovable activity with vibe coding levels and showcase your level on your LinkedIn profile. - [Chat with Lovable in Telegram](https://docs.lovable.dev/tips-tricks/lovable-telegram-bot.md): Chat with the Lovable bot in Telegram to build and manage your projects. Not for integrating Telegram messaging into your apps. - [Using npm packages](https://docs.lovable.dev/tips-tricks/npm-packages.md): Add drag-and-drop, charts, animations, and other advanced features by integrating npm packages into your projects. - [Security best practices for Lovable apps](https://docs.lovable.dev/tips-tricks/security-best-practices.md): Secure coding best practices for Lovable apps, including frontend security, Edge Functions, row-level security (RLS), authentication, and workspace protection. - [Implement SEO and GEO best practices](https://docs.lovable.dev/tips-tricks/seo-geo.md): Optimize your apps for search engines and AI systems with sitemaps, meta tags, structured data, Open Graph images, and performance tuning. - [Troubleshooting](https://docs.lovable.dev/tips-tricks/troubleshooting.md): Fix build errors, debug unexpected behavior, resolve preview issues, and recover from common problems step by step. - [Using images in Lovable](https://docs.lovable.dev/tips-tricks/using-images.md): Upload images to chat, replace them with visual edits, use external URLs, or add files from your GitHub public directory. - [Using videos](https://docs.lovable.dev/tips-tricks/using-videos.md): Embed YouTube videos or upload video files to your GitHub repository and reference them in your Lovable projects."